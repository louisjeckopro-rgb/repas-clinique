<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repas - Clinique Maisonneuve</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7f4;color:#1a1a1a;min-height:100vh}
.hdr{background:#fff;border-bottom:1px solid #e0ebe0;padding:1rem;text-align:center}
.hdr img{height:58px;object-fit:contain}
.wrap{max-width:480px;margin:0 auto;padding:1.25rem 1rem 2rem}
h2{font-size:17px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 20px;border-radius:10px;border:1px solid #ccd8cc;background:#fff;color:#1a1a1a;cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;width:100%;transition:background .15s}
.btn:hover{background:#f0f6f0}
.gn{background:linear-gradient(135deg,#52c97a,#0e7a5a);color:#fff;border:none}
.gn:hover{background:linear-gradient(135deg,#44b86c,#0a6a4c);color:#fff}
.gn:disabled{opacity:.38;cursor:not-allowed}
.sm{padding:7px 14px;font-size:13px;width:auto}
.rd{background:#fff;color:#A32D2D;border-color:#e8b4b4;width:auto}
input,select{width:100%;padding:10px 14px;border:1px solid #ccd8cc;border-radius:10px;background:#fff;color:#1a1a1a;font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#0e7a5a;box-shadow:0 0 0 3px rgba(14,122,90,.1)}
.lb{font-size:13px;color:#555;display:block;margin-bottom:6px;font-weight:500}
.bk{font-size:13px;color:#666;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin-bottom:1.25rem}
.tp{background:#e6f4ec;color:#0e5c38;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.tu{background:#fdf0e0;color:#8a4f00;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.tp:hover{background:#d0ecda}.tu:hover{background:#fae3c0}
.awb{background:#fff8e6;border:1px solid #f0c060;border-radius:10px;padding:9px 14px;color:#7a4400;font-size:13px;margin-bottom:12px}
.wn{background:#fdf0e0;border:1px solid #f0b060;border-radius:10px;padding:10px 14px;color:#7a4400;font-size:13px}
.dv{height:1px;background:#e8eee8;margin:1rem 0}
.tb{display:flex;border-bottom:1px solid #e0ebe0;margin-bottom:1.25rem;overflow-x:auto}
.t{padding:9px 14px;font-size:13px;background:none;border:none;cursor:pointer;font-family:inherit;border-bottom:2.5px solid transparent;color:#888;margin-bottom:-1px;white-space:nowrap}
.t.on{color:#0e7a5a;border-bottom-color:#0e7a5a;font-weight:600}
.st{background:#f4f7f4;border-radius:10px;padding:10px 12px;text-align:center}
.sv{font-size:24px;font-weight:700;line-height:1;margin-top:4px;color:#0e7a5a}
.sl{font-size:11px;color:#777;margin-top:3px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#52c97a,#0e7a5a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.rw{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #e0ebe0;border-radius:12px}
.mc{display:flex;align-items:center;gap:14px;padding:1.1rem;background:#fff;border:1.5px solid #e0ebe0;border-radius:14px;cursor:pointer;transition:border-color .15s;width:100%;text-align:left;font-family:inherit;margin-bottom:10px}
.mc:hover{border-color:#0e7a5a}
.ic{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#d4f2e0,#b0e8c8);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.cb{flex:1;padding:10px 8px;border:1.5px solid #d8e8d8;border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px;text-align:center;line-height:1.4;transition:border-color .15s}
.cb.on{border-color:#0e7a5a;background:#f0faf5;color:#0a5a36;font-weight:600}
.db{flex:1;padding:10px;border:1.5px solid #d8e8d8;border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px;text-align:center;font-weight:500;transition:all .15s}
.db.on{border-color:#0e7a5a;background:#f0faf5;color:#0a5a36}
.db:disabled{opacity:.38;cursor:not-allowed;background:#f8f8f8}
.bm{background:#e6f4ec;color:#0a5a36;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.bp{background:#eef4ff;color:#1a4a8a;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.pt{font-weight:700;color:#0e7a5a;font-size:13px}
.dn{background:#f0faf5;border:1px solid #8cd4aa;border-radius:10px;padding:8px 14px;font-size:13px;color:#0a5a36;margin-bottom:1rem}
.xc{background:#fff;border:1.5px solid #e0ebe0;border-radius:12px;overflow:hidden;margin-bottom:10px}
.xh{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.xh:hover{background:#f8fbf8}
.xb{padding:0 14px 10px;border-top:1px solid #f0f5f0;display:none}
.xl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px dashed #eef3ee}
.xl:last-child{border-bottom:none}
.ldg{text-align:center;padding:3rem 1rem;color:#777;font-size:15px}
</style>
</head>

// Date helpers
function ds(o) { var d = new Date(); d.setDate(d.getDate() + (o||0)); return d.toISOString().slice(0,10); }
function dl(o) { var d = new Date(); d.setDate(d.getDate() + (o||0)); return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }
function fd(k) { try { return new Date(k).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); } catch(e) { return k; } }
function bc() { var n = new Date(); return n.getHours() < 10 || (n.getHours() === 10 && n.getMinutes() < 30); }
function ini(n) { return n.split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase(); }
function pl(c,p) { if(c==="menu") return "Menu - "+(p==="plat1"?"Plat 1":"Plat 2"); return c==="plat1"?"Plat 1":"Plat 2"; }
function pp(c) { return c==="menu"?PM:PP; }

// Data access (via cache)
function lr(offset) { return CACHE.regs[ds(offset)] || []; }
function srg(offset, regs) {
  var dk = ds(offset);
  CACHE.regs[dk] = regs;
  if (regs.length === 0) { DB.ref("regs/"+dk).set(null); return; }
  var obj = {};
  regs.forEach(function(r) { obj["id"+r.id] = r; });
  DB.ref("regs/"+dk).set(obj);
}
function lst() { return CACHE.staff.length > 0 ? CACHE.staff : DEFAULT_STAFF; }
function sst(s) { CACHE.staff = s; DB.ref("staff").set(s); }

// Ardoises
function getArds() {
  var a = {};
  Object.keys(CACHE.regs).forEach(function(dk) {
    (CACHE.regs[dk]||[]).forEach(function(r) {
      if (!r.paid) {
        if (!a[r.name]) a[r.name] = {total:0,items:[]};
        a[r.name].total += pp(r.choice);
        a[r.name].items.push({id:r.id,name:r.name,choice:r.choice,platChoice:r.platChoice,time:r.time,dk:dk});
      }
    });
  });
  return a;
}
function payItem(id, dk) {
  var regs = (CACHE.regs[dk]||[]).map(function(r) {
    return r.id===id ? {id:r.id,name:r.name,choice:r.choice,platChoice:r.platChoice,time:r.time,paid:true} : r;
  });
  CACHE.regs[dk] = regs;
  var obj = {}; regs.forEach(function(r){obj["id"+r.id]=r;});
  DB.ref("regs/"+dk).set(regs.length>0?obj:null);
  drawAdminTab();
}
function payAll(idx) {
  var ards = getArds(), names = Object.keys(ards), name = names[idx];
  if (!name || !confirm("Solder toutes les ardoises de "+name+" ?")) return;
  Object.keys(CACHE.regs).forEach(function(dk) {
    var regs = (CACHE.regs[dk]||[]).map(function(r) {
      return (r.name===name&&!r.paid)?{id:r.id,name:r.name,choice:r.choice,platChoice:r.platChoice,time:r.time,paid:true}:r;
    });
    CACHE.regs[dk] = regs;
    var obj={}; regs.forEach(function(r){obj["id"+r.id]=r;});
    DB.ref("regs/"+dk).set(obj);
  });
  drawAdminTab();
}

// Firebase real-time listener
DB.ref("/").on("value", function(snap) {
  var v = snap.val() || {};
  var newRegs = {};
  if (v.regs) {
    Object.keys(v.regs).forEach(function(dk) {
      var dayObj = v.regs[dk];
      if (dayObj) newRegs[dk] = Object.values(dayObj).filter(function(r){return r&&r.id;});
    });
  }
  CACHE.regs = newRegs;
  CACHE.staff = (v.staff && Array.isArray(v.staff)) ? v.staff : DEFAULT_STAFF;
  if (!LOADED) { LOADED = true; VIEW = "home"; draw(); }
  else {
    if (VIEW==="home") drawHome();
    else if (VIEW==="chef") drawChef();
    else if (VIEW==="admin") drawAdminTab();
  }
});

function draw() {
  if (VIEW==="loading") { APP.innerHTML="<div class='ldg'>Chargement...</div>"; return; }
  if (VIEW==="home") drawHome();
  else if (VIEW==="staff") drawStaff();
  else if (VIEW==="chef") drawChef();
  else if (VIEW==="pin") drawPin();
  else if (VIEW==="admin") drawAdmin();
}
function goHome() { VIEW="home"; draw(); }
function goStaff() { VIEW="staff"; draw(); }
function goChef() { CD=0; VIEW="chef"; draw(); }
function goPin() { VIEW="pin"; draw(); }
function goAdmin() { VIEW="admin"; draw(); }

function drawHome() {
  var t=lr(0), tm=lr(1);
  var h = "<div style='padding:1.25rem 0'>";
  h += "<p style='font-size:13px;color:#777;margin-bottom:1.75rem;text-align:center'>"+dl(0)+"</p>";
  h += "<button class='mc' onclick='goStaff()'><div class='ic'>&#127869;</div><div style='flex:1'><p style='font-weight:600;font-size:15px'>Je m'inscris au repas</p><p style='font-size:12px;color:#777;margin-top:2px'>Aujourd'hui ou demain</p></div><span style='color:#bbb;font-size:20px'>&#8250;</span></button>";
  h += "<button class='mc' onclick='goChef()'><div class='ic'>&#127859;</div><div style='flex:1'><p style='font-weight:600;font-size:15px'>Vue cuisine</p><p style='font-size:12px;color:#777;margin-top:2px'>Auj. "+t.length+" repas &middot; Dem. "+tm.length+" repas</p></div><span style='color:#bbb;font-size:20px'>&#8250;</span></button>";
  h += "<button class='mc' onclick='goPin()'><div class='ic'>&#9881;</div><div style='flex:1'><p style='font-weight:600;font-size:15px'>Gestion &amp; paiements</p><p style='font-size:12px;color:#777;margin-top:2px'>Suivi, ardoises, &eacute;quipe</p></div><span style='color:#bbb;font-size:20px'>&#8250;</span></button>";
  h += "</div>";
  APP.innerHTML = h;
}

var SC="", SP="", SD=0, SN="";
function setC(c) { SC=c; if(c!=="menu") SP=""; drawStaff(); }
function setP(p) { SP=p; drawStaff(); }
function setD(d) { SD=d; drawStaff(); }
function onName() { SN=document.getElementById("sel").value; chkArd(); }
function chkArd() {
  var el=document.getElementById("ardw"); if(!el) return;
  if(!SN){el.innerHTML="";return;}
  var a=getArds();
  if(a[SN]&&a[SN].total>0) el.innerHTML="<div class='awb'>&#9888; "+SN+" a une ardoise de <strong>"+a[SN].total.toFixed(2)+" CHF</strong>.</div>";
  else el.innerHTML="";
}
function drawStaff() {
  var staff=lst(), cut=bc();
  if(!cut&&SD===0) SD=1;
  var opts="<option value=''>&#8212; S&eacute;lectionnez votre nom &#8212;</option>";
  staff.forEach(function(s){opts+="<option value='"+s+"'"+(SN===s?" selected":"")+">"+s+"</option>";});
  var h="<div style='padding:1.25rem 0'>";
  h+="<button class='bk' onclick='goHome()'>&#8592; Retour</button>";
  h+="<h2 style='margin-bottom:4px'>Inscription repas</h2><p style='font-size:13px;color:#777;margin-bottom:1.5rem'>"+dl(0)+"</p>";
  h+="<p class='lb' style='margin-bottom:8px'>Pour quel jour ?</p>";
  h+="<div style='display:flex;gap:8px;margin-bottom:1.25rem'>";
  h+="<button class='db"+(SD===0?" on":"")+"' onclick='setD(0)'"+(cut?"":" disabled")+">";
  h+="<div>&#9728;</div><div>Aujourd'hui</div><div style='font-size:11px;color:#888;margin-top:2px'>"+(cut?"Ouvert":"Ferm&eacute; 10h30")+"</div></button>";
  h+="<button class='db"+(SD===1?" on":"")+"' onclick='setD(1)'>";
  h+="<div>&#128197;</div><div>Demain</div><div style='font-size:11px;color:#888;margin-top:2px'>"+dl(1).split(" ").slice(0,2).join(" ")+"</div></button></div>";
  h+="<p class='lb'>Votre nom</p><select id='sel' onchange='onName()' style='margin-bottom:10px'>"+opts+"</select>";
  h+="<div id='ardw' style='margin-bottom:0'></div>";
  h+="<p class='lb' style='margin-top:12px'>Votre choix</p>";
  h+="<div style='display:flex;gap:8px;margin-bottom:1rem'>";
  h+="<button class='cb"+(SC==="plat1"?" on":"")+"' onclick='setC(\"plat1\")'>&#127829;<br>Plat 1<br><span class='pt'>7 CHF</span></button>";
  h+="<button class='cb"+(SC==="plat2"?" on":"")+"' onclick='setC(\"plat2\")'>&#127858;<br>Plat 2<br><span class='pt'>7 CHF</span></button>";
  h+="<button class='cb"+(SC==="menu"?" on":"")+"' onclick='setC(\"menu\")'>&#127869;<br>Menu<br><span class='pt'>10 CHF</span></button></div>";
  if(SC==="menu"){
    h+="<div style='margin-bottom:1.25rem;padding:12px;background:#f4f9f6;border-radius:10px;border:1px solid #c0e0d0'>";
    h+="<p class='lb' style='margin-bottom:8px'>Plat dans le menu</p><div style='display:flex;gap:8px'>";
    h+="<button class='cb"+(SP==="plat1"?" on":"")+"' onclick='setP(\"plat1\")'>Plat 1</button>";
    h+="<button class='cb"+(SP==="plat2"?" on":"")+"' onclick='setP(\"plat2\")'>Plat 2</button></div></div>";
  }
  var ok=SC&&(SC!=="menu"||SP);
  h+="<button class='btn gn' onclick='doReg()'"+(ok?"":" disabled")+">&#10003; Confirmer mon repas</button></div>";
  APP.innerHTML=h; chkArd();
}
function doReg() {
  if(!SN||!SC||(SC==="menu"&&!SP)) return;
  var regs=lr(SD);
  for(var i=0;i<regs.length;i++){
    if(regs[i].name===SN){
      APP.innerHTML="<div style='padding:1.25rem 0'><button class='bk' onclick='goStaff()'>&#8592; Retour</button><div class='wn' style='margin-top:1rem'>&#9888; "+SN+" est d&eacute;j&agrave; inscrit(e) pour "+(SD===0?"aujourd'hui":"demain")+".</div></div>";
      return;
    }
  }
  var t=new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  regs.push({id:Date.now(),name:SN,choice:SC,platChoice:SP,time:t,paid:false});
  srg(SD,regs);
  var wD=SD,wC=SC,wP=SP,wN=SN;
  SC="";SP="";SD=0;SN="";
  var h="<div style='padding:1.25rem 0;text-align:center'>";
  h+="<div style='width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#52c97a,#0e7a5a);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:30px'>&#9989;</div>";
  h+="<h2 style='margin-bottom:6px'>Inscription confirm&eacute;e !</h2>";
  h+="<p style='color:#555;font-size:14px;margin-bottom:4px'>"+wN+"</p>";
  h+="<p style='color:#0e7a5a;font-size:15px;font-weight:600;margin-bottom:4px'>"+pl(wC,wP)+" &mdash; "+pp(wC).toFixed(2)+" CHF</p>";
  h+="<p style='color:#888;font-size:13px;margin-bottom:1.5rem'>"+(wD===0?"Aujourd'hui":"Demain, "+dl(1).split(" ").slice(0,2).join(" "))+"</p>";
  h+="<button class='btn' onclick='goHome()'>Retour &agrave; l'accueil</button></div>";
  APP.innerHTML=h;
}

var CI=null, CD=0;
function setCD(d){CD=d;drawChef();}
function drawChef() {
  if(CI) clearInterval(CI);
  var regs=lr(CD);
  var n1=0,n2=0,nm=0;
  regs.forEach(function(r){
    if(r.choice==="plat1"||(r.choice==="menu"&&r.platChoice==="plat1"))n1++;
    if(r.choice==="plat2"||(r.choice==="menu"&&r.platChoice==="plat2"))n2++;
    if(r.choice==="menu")nm++;
  });
  var h="<div style='padding:1.25rem 0'>";
  h+="<button class='bk' onclick='goHome();if(CI)clearInterval(CI);'>&#8592; Retour</button>";
  h+="<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem'>";
  h+="<div><h2 style='margin-bottom:2px'>Vue cuisine</h2><p style='font-size:13px;color:#777'>"+dl(CD)+"</p></div>";
  h+="<div style='text-align:center;background:linear-gradient(135deg,#d4f2e0,#b0e8c8);border-radius:12px;padding:8px 16px'><div style='font-size:28px;font-weight:800;color:#0a5a36;line-height:1'>"+regs.length+"</div><div style='font-size:11px;color:#0e7a5a'>repas</div></div></div>";
  h+="<div class='tb'><button class='t"+(CD===0?" on":"")+"' onclick='setCD(0)'>Aujourd'hui</button><button class='t"+(CD===1?" on":"")+"' onclick='setCD(1)'>Demain</button></div>";
  h+="<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.25rem'>";
  h+="<div class='st'><div>&#127829;</div><div class='sv'>"+n1+"</div><div class='sl'>Plat 1</div></div>";
  h+="<div class='st'><div>&#127858;</div><div class='sv'>"+n2+"</div><div class='sl'>Plat 2</div></div>";
  h+="<div class='st'><div>&#127869;</div><div class='sv'>"+nm+"</div><div class='sl'>Menus</div></div></div>";
  if(regs.length===0){h+="<div style='text-align:center;padding:2rem 0;color:#aaa;font-size:14px'>Aucune inscription</div>";}
  else{
    h+="<div style='display:flex;flex-direction:column;gap:8px'>";
    regs.forEach(function(r){
      h+="<div class='rw'><div class='av'>"+ini(r.name)+"</div><div style='flex:1'><p style='font-size:14px;font-weight:500'>"+r.name+"</p><p style='font-size:12px;color:#777'>"+pl(r.choice,r.platChoice)+" &middot; "+r.time+"</p></div>";
      h+="<span class='"+(r.choice==="menu"?"bm":"bp")+"'>"+(r.choice==="menu"?"Menu":(r.choice==="plat1"?"Plat 1":"Plat 2"))+"</span></div>";
    });
    h+="</div>";
  }
  h+="<p style='font-size:11px;color:#aaa;text-align:center;margin-top:1rem'>&#128260; Mise &agrave; jour en temps r&eacute;el</p></div>";
  APP.innerHTML=h;
}

function drawPin() {
  var h="<div style='padding:1.25rem 0'><button class='bk' onclick='goHome()'>&#8592; Retour</button>";
  h+="<div style='max-width:300px;margin:1rem auto 0;text-align:center'>";
  h+="<div style='width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#d4f2e0,#b0e8c8);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:26px'>&#128274;</div>";
  h+="<h2 style='margin-bottom:4px'>Acc&egrave;s gestion</h2><p style='font-size:13px;color:#777;margin-bottom:1.25rem'>Code PIN requis</p>";
  h+="<input type='password' id='pin' placeholder='----' style='text-align:center;font-size:22px;letter-spacing:8px;margin-bottom:12px' onkeydown='if(event.key===\"Enter\")chkPin()'>";
  h+="<div id='perr' style='color:#A32D2D;font-size:13px;margin-bottom:8px;display:none'>Code incorrect</div>";
  h+="<button class='btn gn' onclick='chkPin()'>Acc&eacute;der</button></div></div>";
  APP.innerHTML=h;
}
function chkPin() {
  var p=document.getElementById("pin").value;
  if(p===PIN){goAdmin();}
  else{document.getElementById("perr").style.display="block";document.getElementById("pin").value="";}
}

var AT="today";
function setAT(t){AT=t;drawAdmin();}
function drawAdmin() {
  var h="<div style='padding:1.25rem 0'>";
  h+="<button class='bk' onclick='goHome()'>&#8592; Retour</button>";
  h+="<h2 style='margin-bottom:4px'>Gestion &amp; paiements</h2><p style='font-size:13px;color:#777;margin-bottom:1.25rem'>"+dl(0)+"</p>";
  h+="<div class='tb'>";
  h+="<button class='t"+(AT==="today"?" on":"")+"' onclick='setAT(\"today\")'>Aujourd'hui</button>";
  h+="<button class='t"+(AT==="tomorrow"?" on":"")+"' onclick='setAT(\"tomorrow\")'>Demain</button>";
  h+="<button class='t"+(AT==="ardoises"?" on":"")+"' onclick='setAT(\"ardoises\")'>Ardoises</button>";
  h+="<button class='t"+(AT==="staff"?" on":"")+"' onclick='setAT(\"staff\")'>Equipe</button>";
  h+="</div><div id='ac'></div></div>";
  APP.innerHTML=h; drawAdminTab();
}
function drawAdminTab() {
  var el=document.getElementById("ac"); if(!el) return;
  var h="";
  if(AT==="today"||AT==="tomorrow"){
    var off=AT==="tomorrow"?1:0, regs=lr(off);
    var paid=0,tot=0,col=0;
    regs.forEach(function(r){tot+=pp(r.choice);if(r.paid){paid++;col+=pp(r.choice);}});
    if(off===1) h+="<div class='dn'>&#128197; Commandes pour "+dl(1)+"</div>";
    h+="<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1rem'>";
    h+="<div class='st'><div>&#128101;</div><div class='sv'>"+regs.length+"</div><div class='sl'>Total</div></div>";
    h+="<div class='st'><div>&#9989;</div><div class='sv'>"+paid+"</div><div class='sl'>Pay&eacute;</div></div>";
    h+="<div class='st'><div>&#9203;</div><div class='sv'>"+(regs.length-paid)+"</div><div class='sl'>&Agrave; encaisser</div></div></div>";
    h+="<div style='display:flex;justify-content:space-between;font-size:13px;color:#555;margin-bottom:1rem'>";
    h+="<span>Encaiss&eacute; : <strong style='color:#0e7a5a'>"+col.toFixed(2)+" CHF</strong></span>";
    h+="<span>Total pr&eacute;vu : <strong>"+tot.toFixed(2)+" CHF</strong></span></div><div class='dv'></div>";
    if(regs.length===0){h+="<p style='text-align:center;color:#aaa;font-size:14px;padding:1.5rem 0'>Aucune inscription</p>";}
    else{regs.forEach(function(r){
      h+="<div class='rw' style='margin-bottom:8px'><div class='av'>"+ini(r.name)+"</div>";
      h+="<div style='flex:1'><p style='font-size:14px;font-weight:500'>"+r.name+"</p><p style='font-size:12px;color:#777'>"+pl(r.choice,r.platChoice)+" &middot; "+pp(r.choice).toFixed(2)+" CHF &middot; "+r.time+"</p></div>";
      h+="<button class='"+(r.paid?"tp":"tu")+"' onclick='tgPaid("+r.id+","+off+")'>"+(r.paid?"Pay&eacute;":"&Agrave; payer")+"</button>";
      h+="<button onclick='delReg("+r.id+","+off+")' style='background:none;border:none;cursor:pointer;color:#ccc;font-size:22px;padding:4px;line-height:1'>&times;</button></div>";
    });}
  }
  if(AT==="ardoises"){
    var ards=getArds(),names=Object.keys(ards);
    if(names.length===0){h="<div style='text-align:center;padding:2.5rem 0;color:#aaa;font-size:14px'>&#9989; Aucune ardoise en cours</div>";}
    else{
      var tg=0; names.forEach(function(n){tg+=ards[n].total;});
      h+="<div style='display:flex;justify-content:space-between;margin-bottom:1rem'>";
      h+="<p style='font-size:13px;color:#555'>"+names.length+" personne"+(names.length>1?"s":"")+" avec ardoise</p>";
      h+="<p style='font-size:14px;font-weight:700;color:#b06000'>"+tg.toFixed(2)+" CHF</p></div>";
      names.forEach(function(nm,ni){
        var ai=ards[nm];
        h+="<div class='xc'><div class='xh' onclick='togX("+ni+")'>";
        h+="<div class='av'>"+ini(nm)+"</div>";
        h+="<div style='flex:1'><p style='font-size:14px;font-weight:600'>"+nm+"</p><p style='font-size:12px;color:#999'>"+ai.items.length+" repas impay&eacute;"+(ai.items.length>1?"s":"")+"</p></div>";
        h+="<span style='font-size:15px;font-weight:700;color:#b06000;margin-right:8px'>"+ai.total.toFixed(2)+" CHF</span>";
        h+="<button class='btn gn sm' onclick='event.stopPropagation();payAll("+ni+")'>Tout r&eacute;gler</button></div>";
        h+="<div class='xb' id='xb"+ni+"'>";
        ai.items.forEach(function(it){
          h+="<div class='xl'><div><span style='color:#555'>"+fd(it.dk)+"</span><span style='color:#888;margin-left:8px'>"+pl(it.choice,it.platChoice)+"</span></div>";
          h+="<div style='display:flex;align-items:center;gap:8px'><span style='font-weight:600;color:#b06000'>"+pp(it.choice).toFixed(2)+" CHF</span>";
          h+="<button class='tp' onclick='payItem("+it.id+",\""+it.dk+"\")'>R&eacute;gler</button></div></div>";
        });
        h+="</div></div>";
      });
    }
  }
  if(AT==="staff"){
    var staff=lst();
    h+="<div style='display:flex;gap:8px;margin-bottom:1rem'>";
    h+="<input type='text' id='ns' placeholder='Ajouter un membre...' onkeydown='if(event.key===\"Enter\")addStaff()'>";
    h+="<button class='btn gn sm' onclick='addStaff()' style='white-space:nowrap'>+ Ajouter</button></div>";
    h+="<div style='display:flex;flex-direction:column;gap:8px'>";
    staff.forEach(function(s){
      h+="<div class='rw'><div class='av'>"+ini(s)+"</div><span style='flex:1;font-size:14px'>"+s+"</span>";
      h+="<button class='btn rd' onclick='rmStaff(\""+s.replace(/"/g,"&quot;")+"\")' style='font-size:12px;padding:6px 10px'>Supprimer</button></div>";
    });
    h+="</div>";
  }
  el.innerHTML=h;
}

function togX(i){var el=document.getElementById("xb"+i);if(el)el.style.display=el.style.display==="block"?"none":"block";}
function tgPaid(id,off){
  var r=lr(off);
  srg(off,r.map(function(x){return x.id===id?{id:x.id,name:x.name,choice:x.choice,platChoice:x.platChoice,time:x.time,paid:!x.paid}:x;}));
  drawAdminTab();
}
function delReg(id,off){if(!confirm("Supprimer ?"))return;srg(off,lr(off).filter(function(r){return r.id!==id;}));drawAdminTab();}
function addStaff(){var inp=document.getElementById("ns"),n=inp?inp.value.trim():"";if(!n)return;var s=lst();if(s.indexOf(n)>=0){alert("Deja dans la liste");return;}s.push(n);sst(s);drawAdminTab();}
function rmStaff(n){if(!confirm("Supprimer "+n+" ?"))return;sst(lst().filter(function(s){return s!==n;}));drawAdminTab();}

</script>
</body>
</html>
